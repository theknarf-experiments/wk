# Build this plugin: `mise run build`
# wsh targets wasm32-wasip2 (not cargo-component/wasip1): p2 is where Rust's
# std::net lives, and rustc emits a component directly for it — sockets then
# ride wk's fabric with no adapter.
[tasks.build]
description = "Build this plugin into a wasm component (wasip2 for std::net)"
dir = "{{config_root}}"
run = """
rustup target add wasm32-wasip2
cargo build --release --target wasm32-wasip2
cp target/wasm32-wasip2/release/wsh.wasm wsh.wasm
"""
