# Build this plugin: `mise run preflight` first, then `mise run build`.
#
# Three stages, because none can start until the previous one has finished:
#
#   build-configure  patches src/, then runs autogen.sh out of tree in ./build.
#                    Produces config_host.mk (OS=WASI) and, via a whole second
#                    nested configure, config_build.mk (native arm64 macOS).
#                    Minutes. Milestone M0.
#   build-host       `make cross-toolset` — the NATIVE bootstrap: ~26 code
#                    generators (wasmbridgegen above all) plus a native ICU.
#                    Estimated 20-40 min on this box, never measured.
#                    Milestone M1.
#   build-lo         the cross build. Hours, and the rung most likely to fail.
#                    Milestones M2 (a module) and M3 (the link).
#
# Both build stages are long. Run them detached and tail ./logs rather than
# waiting on a foreground timeout. `./build-lo.sh sal` builds one module and is
# where you should start — every wasi-libc gap this port has to close lives in
# sal, and finding them there costs minutes instead of at the end of a
# multi-hour link.
#
# Host tools are declared here, like every other toolchain in this repo, so a
# clone can build the port without anyone being told to `brew install` first.
# They come from two places because mise can only reach one of them:
#
#   ccache          a mise [tools] pin below. Optional for correctness and
#                   close to mandatory in practice: this is a two-stage build
#                   of one of the largest C++ codebases there is, and without
#                   it every configure-flag experiment re-pays the whole native
#                   bootstrap.
#   gmake, gperf    `mise run deps`, which builds them from pinned GNU tarballs
#                   into .hosttools and links them into .toolbin. Not mise
#                   [tools] because neither exists as an aqua or ubi package
#                   (both are savannah releases, not GitHub ones) and mise's
#                   asdf make plugin fails GPG verification without GNU's
#                   signing key in your keyring. See build-deps.sh.
#
# configure.ac:6907 rejects GNU Make < 4.2 and :8201 rejects gperf < 3.1, both
# as hard errors; macOS ships 3.81 and 3.0.3 respectively.

[tools]
"github:ccache/ccache" = "4.14"

[tasks.deps]
description = "Build the host tools macOS lacks (GNU Make >= 4.2, gperf >= 3.1) into .hosttools"
dir = "{{config_root}}"
# Idempotent and quick (~2 min, once). Every stage depends on it rather than
# checking and complaining, because a build that can install its own
# prerequisites is one less thing between a fresh clone and a first build.
run = "./build-deps.sh"

[tasks.preflight]
description = "Probe the toolchain, the host tools and src/ — compiles nothing"
dir = "{{config_root}}"
depends = ["deps"]
run = "WASI_SDK=$(mise where github:WebAssembly/wasi-sdk) ./preflight.sh"

[tasks.build-shim]
description = "Build the wasip2 thread shim archive every LibreOffice link needs (~1s)"
dir = "{{config_root}}"
# Not in the `depends` chain below: build-configure.sh, build-host.sh and
# build-lo.sh each invoke ./build-shim.sh themselves, because the archive has
# to exist before make parses WASI_INTEL_GCC.mk and that is true of all three
# stages. This task exists so it can be run — and found — on its own after an
# edit to shim/wk-wasi-threads.c.
run = "WASI_SDK=$(mise where github:WebAssembly/wasi-sdk) ./build-shim.sh"

[tasks.build-configure]
description = "Configure LibreOffice for wasm32-wasip2 into ./build (M0)"
dir = "{{config_root}}"
depends = ["deps"]
# wasi-sdk comes from the root mise.toml [tools]; resolved at task time because
# `mise where` cannot be used in an [env] template — it would recurse. Same
# shape as plugins/qt. The scripts fall back to the mise install path when run
# outside mise.
run = "WASI_SDK=$(mise where github:WebAssembly/wasi-sdk) ./build-configure.sh"

[tasks.build-host]
description = "Native bootstrap: make cross-toolset, producing wasmbridgegen (M1)"
dir = "{{config_root}}"
depends = ["build-configure"]
# Builds nothing for wasm; WASI_SDK is exported only so the shared guard in
# common.sh fails loudly on a toolchain mismatch instead of half-building.
run = "WASI_SDK=$(mise where github:WebAssembly/wasi-sdk) ./build-host.sh"

[tasks.build-lo]
description = "Cross-build LibreOffice for wasm32-wasip2 (M2/M3) — hours"
dir = "{{config_root}}"
depends = ["build-host"]
run = "WASI_SDK=$(mise where github:WebAssembly/wasi-sdk) ./build-lo.sh"

# The repo-wide `mise run build-plugins` (root mise.toml) invokes every
# plugin's `build` task. This one must not turn that sweep into an overnight
# LibreOffice build while the port is still scaffolding, so it self-skips until
# patches/ has something in it — exactly the guard plugins/qt carries, and for
# the same reason. Nothing can configure before those patches exist anyway:
# build-configure.sh refuses, by design, with the list of what to write.
#
# The moment the first patch lands this becomes a real, and very long, build.
[tasks.build]
description = "Build the LibreOffice port (opt-in: the full build is hours and does not link yet)"
dir = "{{config_root}}"
run = """
set -e
# The repo-wide `mise run build-plugins` sweep calls every plugin's `build`
# task under `set -e`, so this one must not turn that sweep into an overnight
# LibreOffice build -- and right now it would not even be a SUCCESSFUL one: the
# port stops at `bridges`, on a decision recorded in PORTING.md.
#
# The original guard was "skip while patches/ is empty", which stopped guarding
# anything the moment the port started working. The condition that actually
# matters is not "are there patches" but "is a full build known to complete",
# so this is an explicit opt-in until that is true.
if [ "${WK_LO_BUILD:-0}" != "1" ]; then
  echo "libreoffice: skipping -- the full build is hours long and does not link yet."
  echo "    It stops at bridges/gcc3_wasm (cpp2uno.cxx needs emscripten.h); see"
  echo "    PORTING.md 'Current state' for where the port actually is."
  echo "    Per-stage: ./preflight.sh, ./build-configure.sh, ./build-host.sh,"
  echo "    ./build-lo.sh <module>.allbuild"
  echo "    To run the whole thing anyway: WK_LO_BUILD=1 mise run build"
  exit 0
fi
./build-deps.sh
SDK=$(mise where github:WebAssembly/wasi-sdk)
WASI_SDK="$SDK" ./build-configure.sh
WASI_SDK="$SDK" ./build-host.sh
WASI_SDK="$SDK" ./build-lo.sh
echo "libreoffice: see ./build/instdir and PORTING.md 'Current state'"
"""
