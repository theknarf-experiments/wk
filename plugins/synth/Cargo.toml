[package]
name = "synth"
version = "0.1.0"
edition = "2024"

[dependencies]
# One complete bitmap font, shared and tested, instead of a private `match`
# holding only the letters this plugin's labels happened to spell.
wk-pixelfont = { path = "../../crates/wk-pixelfont" }
wit-bindgen-rt = { version = "0.44.0", features = ["bitflags"] }

[lib]
crate-type = ["cdylib"]

[package.metadata.component]
package = "wk:synth"

[package.metadata.component.dependencies]

[package.metadata.component.target.dependencies]
"wasi:surface" = { path = "wit/deps/wasi-surface" }
"wasi:graphics-context" = { path = "wit/deps/wasi-graphics-context" }
"wasi:frame-buffer" = { path = "wit/deps/wasi-frame-buffer" }
"wasi:io" = { path = "wit/deps/wasi-io" }
"wk:midi" = { path = "wit/deps/wk-midi" }
"wk:webaudio" = { path = "wit/deps/wk-webaudio" }
"wk:options" = { path = "wit/deps/wk-options" }
