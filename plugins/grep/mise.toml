# Build this plugin: `mise run build`
[tasks.build]
description = "Cross-compile upstream GNU grep into a wasm component"
dir = "{{config_root}}"
# wasi-sdk comes from the root mise.toml [tools]; point build.sh at its install
# (resolved at task time, like the other C plugins) — the ~/wasi-sdk default
# only ever existed on a machine that installed the sdk by hand.
run = "WASI_SDK=$(mise where github:WebAssembly/wasi-sdk) ./build.sh"
