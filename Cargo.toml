[workspace]
# The root `wk` binary is a member automatically; `crates/` holds the shared
# pieces. `plugins/` are independent cargo-component crates built on their own.
members = ["crates/*"]
exclude = ["plugins"]
resolver = "2"

[package]
name = "wk"
version = "0.1.0"
edition = "2021"

# The wk binary is just the CLI: it parses args, runs the workspace
# subcommands, builds the server, and hands it to a client. The contract, the
# backend, and the local UI client each live in their own crate.
[dependencies]
biscuit-auth = "6.0"
wk-api = { path = "crates/wk-api" }
wk-protocol = { path = "crates/wk-protocol" }
wk-server = { path = "crates/wk-server" }
wk-token-service = { path = "crates/wk-token-service" }
client-local-ui = { path = "crates/client-local-ui" }
env_logger = "0.11.11"
clap = { version = "4.6.1", features = ["derive"] }
libc = "0.2.189"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Optimize dependency crates even in debug builds. The wk daemon runs wasmtime,
# which AOT-compiles guest components (e.g. the 181 MB bun-run.wasm) via
# cranelift-codegen when a node starts — at opt-level 0 that takes minutes, so a
# plain `cargo build -p wk` (debug) is unusable for iterating on wasm guests.
# Optimizing dependencies (wasmtime, cranelift-codegen, regalloc2, …) keeps that
# compile fast; the workspace crates stay unoptimized so editing wk still builds
# quickly. Deps are cached, so the cost is a one-time first build.
[profile.dev.package."*"]
opt-level = 3
