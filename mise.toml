[settings]
# Install cargo-based tools (cargo-component) from a prebuilt binary when
# cargo-binstall is available, instead of compiling from source.
cargo.binstall = true

[tools]
# Plugin build toolchain, shared by every plugin's `build` task (mise config
# inherits down the tree). Pinned for reproducibility.
"cargo:cargo-component" = "0.21.1"       # Rust plugins → wasm components
"cargo:wit-bindgen-cli" = "0.46.0"       # C bindings for wk's custom host interfaces
# Fully-qualified backend: the bare "wasm-tools" shorthand only resolves on
# machines whose mise registry happens to know it — a fresh install doesn't.
"aqua:bytecodealliance/wasm-tools" = "1.252.0"  # componentization for C plugins
# An -rc because dup/dup2/dup3/F_DUPFD for wasip2 landed in wasi-libc on
# 2026-07-17, after wasi-sdk-33 was cut. Without them a guest cannot save and
# restore a descriptor, so no shell redirection and no bash /dev/tcp.
"github:WebAssembly/wasi-sdk" = "wasi-sdk-34-rc.2"  # clang + wasi-sysroot for C plugins

[env]
# Homebrew's lib dir, where the host-side libraries a few plugin builds link
# (libpng for netsurf's convert_image, …) live on a Mac. `brew` isn't on a
# plain Linux box, and an exec() that fails takes the WHOLE config down with a
# parse error before any task can run — so swallow it and fall back to a path
# that simply doesn't exist.
LIBRARY_PATH = "{{env.LIBRARY_PATH | default(value='')}}:{{exec(command='brew --prefix 2>/dev/null || echo /nonexistent')}}/lib"
_.path = ["{{config_root}}"]

[tasks.setup-hooks]
description = "Use .hooks as the git hooks directory"
run = "git config core.hooksPath .hooks"

[tasks.test]
description = "Run the workspace test suite"
run = "cargo nextest run --workspace"

[tasks.build-plugins]
description = "Build every plugin via its own `build` task (run after switching branches — built .wasm artifacts are gitignored and go stale)"
run = """
set -e
for d in plugins/*/; do
  [ -f "$d/mise.toml" ] || continue
  echo "== $d"
  # Trust is per-config-file, so on a fresh clone every plugin's mise.toml is
  # untrusted and `mise run build` below refuses to run. Trusting them here is
  # not a widening: they are this repo's own files, and running this task
  # already means trusting the root config that ships them.
  mise trust --quiet "$d/mise.toml"
  (cd "$d" && mise run build)
done
"""
