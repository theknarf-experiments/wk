[settings]
# Install cargo-based tools (cargo-component) from a prebuilt binary when
# cargo-binstall is available, instead of compiling from source.
cargo.binstall = true

[tools]
# Plugin build toolchain, shared by every plugin's `build` task (mise config
# inherits down the tree). Pinned for reproducibility.
"cargo:cargo-component" = "0.21.1"       # Rust plugins → wasm components
"cargo:wit-bindgen-cli" = "0.46.0"       # C bindings for wk's custom host interfaces
# Fully-qualified backend: the bare "wasm-tools" shorthand only resolves on
# machines whose mise registry happens to know it — a fresh install doesn't.
"aqua:bytecodealliance/wasm-tools" = "1.252.0"  # componentization for C plugins
# An -rc because dup/dup2/dup3/F_DUPFD for wasip2 landed in wasi-libc on
# 2026-07-17, after wasi-sdk-33 was cut. Without them a guest cannot save and
# restore a descriptor, so no shell redirection and no bash /dev/tcp.
"github:WebAssembly/wasi-sdk" = "wasi-sdk-34-rc.2"  # clang + wasi-sysroot for C plugins

[env]
# Homebrew's lib dir, where the host-side libraries a few plugin builds link
# live on a Mac. macOS ONLY, deliberately:
#
# linuxbrew installs to the same layout but builds against a NEWER glibc than
# the distro, so putting its lib dir on a Linux linker search path shadows the
# system copies with ones the system loader cannot resolve. Two ways that bit:
# wk-server's tests stopped linking (libasound wanting __isoc23_* from glibc
# 2.38 on a 2.36 box), and CPython's configure half-detected ncurses — finding
# libncursesw to link but no header to compile against, so the _curses module
# was enabled and then failed on "unknown type name WINDOW".
#
# A Linux box that genuinely needs a library the distro lacks should say so
# where it is needed, scoped, the way plugins/netsurf/build.sh resolves its
# host libpng.
LIBRARY_PATH = "{{env.LIBRARY_PATH | default(value='')}}{% if os() == 'macos' %}:{{exec(command='brew --prefix')}}/lib{% endif %}"
_.path = ["{{config_root}}"]

[tasks.setup-hooks]
description = "Use .hooks as the git hooks directory"
run = "git config core.hooksPath .hooks"

[tasks.test]
description = "Run the workspace test suite"
run = "cargo nextest run --workspace"

[tasks.build-plugins]
description = "Build every plugin via its own `build` task (run after switching branches — built .wasm artifacts are gitignored and go stale)"
run = """
set -e
for d in plugins/*/; do
  [ -f "$d/mise.toml" ] || continue
  echo "== $d"
  # Trust is per-config-file, so on a fresh clone every plugin's mise.toml is
  # untrusted and `mise run build` below refuses to run. Trusting them here is
  # not a widening: they are this repo's own files, and running this task
  # already means trusting the root config that ships them.
  mise trust --quiet "$d/mise.toml"
  (cd "$d" && mise run build)
done
"""

[tasks.test-pulley]
description = "Run the suite on the Pulley interpreter (the no-JIT backend an iOS build needs)"
run = "cargo nextest run --workspace --features pulley"

[tasks.test-small-memory]
description = "Run the suite with phone-sized guest memory reservations"
run = "WK_MEMORY_RESERVATION_MIB=${WK_MEMORY_RESERVATION_MIB:-64} cargo nextest run --workspace"

[tasks.test-ios-shape]
description = "Run the suite the way an iOS build behaves: interpreted, with small reservations"
run = "WK_MEMORY_RESERVATION_MIB=${WK_MEMORY_RESERVATION_MIB:-64} cargo nextest run --workspace --features pulley"

[tasks.mem-report]
description = "Measure a running server's address-space footprint at several reservation sizes (macOS)"
run = "./scripts/mem-report.sh"

[tasks.ios-check]
description = "Report what is still missing before wk can be built and run for iOS"
run = "./scripts/ios-check.sh"

[tasks.ios-smoke]
description = "Boot wk's runtime in the iOS simulator and report engine/fabric/guest checks"
run = "./scripts/ios-smoke.sh"

[tasks.ios-build]
description = "Build wk-server for iOS (simulator; `--device` for hardware). Run `mise run ios-check` first"
run = "./scripts/ios-build.sh"
